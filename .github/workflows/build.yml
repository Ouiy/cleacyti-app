name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project archive
        run: unzip -o ProjetComplet.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          elif [ -f "CleanCityBotEnergy/package.json" ]; then
            cd CleanCityBotEnergy && npm install
          fi

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            npx cap sync android
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -d "CleanCityBotEnergy/android" ]; then
            cd CleanCityBotEnergy
            npx cap sync android
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
