name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract main archive
        run: |
          mkdir -p extracted_files
          unzip -o ProjetComplet.zip -d extracted_files || true

      - name: Extract nested archive if present
        run: |
          if [ -f "extracted_files/CleanCityBot.zip" ]; then
            unzip -o extracted_files/CleanCityBot.zip -d . || true
          else
            cp -r extracted_files/* .
          fi

      - name: Fix file permissions
        run: chmod -R u+rwX .

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Android APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
